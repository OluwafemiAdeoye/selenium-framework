# =============================================================================
# Base Configuration
# Overridden by: environment-specific files (config-{env}.properties) and -D flags
#
# Usage:
#   Local (default):     mvn clean verify
#   Local + cloud:       mvn clean verify -Denv=lambdatest -DLT_USERNAME=xxx -DLT_ACCESS_KEY=xxx
#   Pipeline + cloud:    configured in bitbucket-pipelines.yml with repo variables
# =============================================================================

# Application
base.url=https://the-internet.herokuapp.com
app.name=Selenium Framework

# Browser selection: chrome | firefox | edge | safari
browser=chrome
headless=false

# Execution mode: local | browserstack | saucelabs | lambdatest
# NOTE: When using -Denv=lambdatest (or browserstack/saucelabs), the env-specific
# config file automatically sets this value. No need to pass -Dexecution.mode separately.
execution.mode=local

# ---- Window / Viewport ----
# Maximize browser on launch. Set to false and provide width/height for custom viewport.
window.maximize=true
window.width=1920
window.height=1080

# ---- Timeouts (seconds) ----
implicit.wait.seconds=10
explicit.wait.seconds=15
page.load.timeout.seconds=30
script.timeout.seconds=30
polling.interval.millis=500

# ---- Screenshots ----
# Capture screenshot on failure (saved to disk + attached to Allure & ExtentReports)
screenshot.on.failure=true
# Capture screenshot on pass (useful for visual evidence in reports)
screenshot.on.pass=false

# ---- Video Recording ----
# Record screen video on failure (only works in headed/local mode)
video.record.on.failure=true

# ---- Retry ----
max.retry.count=1

# ---- Downloads ----
download.dir=target/downloads

# ---- Reporting ----
# ExtentReports theme: STANDARD | DARK
extent.report.theme=DARK
# ExtentReports document title and report name
extent.report.title=Automation Test Report
extent.report.name=Selenium Framework Report
# Delete old reports before each suite run
delete.old.reports=false

# ---- Debugging ----
# Highlight elements before interaction (adds a brief red border) — useful for debugging
highlight.elements=false
# Slow-motion delay (ms) between each interaction (click, type, navigate).
# Set > 0 so a human observer can follow the test visually. 0 = no delay.
step.delay.millis=500

# ---- Parallel Execution ----
# Control parallel execution directly from this config file.
# The framework reads these values at runtime via TestNG's IAlterSuiteListener
# and applies them before any test runs — no Maven flags needed.
#
#   Sequential (default):  parallel.execution=false
#   Parallel by methods:   parallel.execution=true, parallel.mode=methods
#   Parallel by classes:   parallel.execution=true, parallel.mode=classes
#
# Valid parallel.mode values: methods | classes | tests
#
# NOTE: When running on cloud platforms (BrowserStack, LambdaTest, SauceLabs),
# keep thread.count within your plan's session limit.
# Can still be overridden via -D flags:
#   mvn clean verify -Dparallel.execution=true -Dparallel.mode=methods -Dthread.count=4
parallel.execution=true
parallel.mode=methods
thread.count=2

# ---- Cloud Platform Settings ----
# Each cloud platform has its own config file with full settings:
#   config-lambdatest.properties   — grid URL, video, network, console, visual, tunnel, timeouts
#   config-browserstack.properties — grid URL, video, network logs, console logs, tunnel, timeouts
#   config-saucelabs.properties    — grid URL, video, screenshots, extended debugging, tunnel, timeouts
#
# Credentials should be passed via system properties (-D) or environment variables.
# Do NOT commit real credentials to version control.
#
# Credentials resolution order (first non-empty wins):
#   1. System properties:  -DLT_USERNAME=xxx -DLT_ACCESS_KEY=xxx
#   2. Environment vars:   export LT_USERNAME=xxx  export LT_ACCESS_KEY=xxx
#   3. Config file values: lambdatest.username / lambdatest.accesskey
#
# Unresolved ${...} placeholders in config are automatically skipped —
# the framework falls back to the next resolution tier.
#
# Every cloud setting can be overridden via -D flags without editing config files:
#   mvn clean verify -Denv=lambdatest -Dlambdatest.video=false -Dlambdatest.tunnel=true
