# =============================================================================
# SauceLabs Cloud Execution Configuration
# Activated via: mvn clean test -Denv=saucelabs
#
# Credentials resolution order (first non-empty wins):
#   1. System properties:  -DSAUCELABS_USERNAME=xxx -DSAUCELABS_ACCESS_KEY=xxx
#   2. Environment vars:   export SAUCE_USERNAME=xxx  export SAUCE_ACCESS_KEY=xxx
#   3. Properties below:   saucelabs.username / saucelabs.accesskey
#
# Grid URL is auto-built from credentials + datacenter. Override for private cloud:
#   -Dsaucelabs.grid.url=https://user:key@ondemand.us-west-1.saucelabs.com:443/wd/hub
# =============================================================================

execution.mode=saucelabs
headless=false

# ---- Credentials ----
# Leave blank here; pass via -D flags or CI env vars (never commit real keys)
saucelabs.username=${SAUCE_USERNAME}
saucelabs.accesskey=${SAUCE_ACCESS_KEY}

# ---- Datacenter ----
# Available regions: us-west-1 | eu-central-1
saucelabs.datacenter=us-west-1
saucelabs.grid.url=https://${SAUCE_USERNAME}:${SAUCE_ACCESS_KEY}@ondemand.us-west-1.saucelabs.com:443/wd/hub

# ---- Platform / OS ----
saucelabs.platform=Windows 11
saucelabs.browser.version=latest

# ---- Build & Session Identity ----
# ${BUILD_NUMBER} is auto-resolved from CI (Bitbucket/GitHub) or falls back to timestamp
saucelabs.build.name=Selenium Framework - Build #${BUILD_NUMBER}
saucelabs.project.name=Selenium Framework
saucelabs.test.name=${TEST_NAME}

# ---- Debugging & Diagnostics ----
# Extended debugging: capture HAR files, console logs, and JS exceptions
saucelabs.extended.debugging=true
# Video: record test execution video (recommended for failure analysis)
saucelabs.video=true
# Screenshots: capture step-by-step screenshots
saucelabs.screenshots=true
# Logs: capture raw Selenium command logs
saucelabs.selenium.logs=true

# ---- Sauce Connect (Tunnel) ----
# Set to true when testing apps behind a firewall/localhost
# Requires Sauce Connect Proxy running locally or in CI
saucelabs.tunnel=false
saucelabs.tunnel.identifier=

# ---- Timeouts ----
# Max seconds a test can idle before auto-termination
saucelabs.idle.timeout=120
# Max seconds a test can run before force-termination
saucelabs.max.duration=1800

# ---- Performance ----
# Disable video/screenshots in CI to speed up sessions:
#   mvn clean test -Denv=saucelabs -Dsaucelabs.video=false -Dsaucelabs.screenshots=false
