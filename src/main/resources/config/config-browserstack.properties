# =============================================================================
# BrowserStack Cloud Execution Configuration
# Activated via: mvn clean test -Denv=browserstack
#
# Credentials resolution order (first non-empty wins):
#   1. System properties:  -DBROWSERSTACK_USERNAME=xxx -DBROWSERSTACK_ACCESS_KEY=xxx
#   2. Environment vars:   export BROWSERSTACK_USERNAME=xxx  export BROWSERSTACK_ACCESS_KEY=xxx
#   3. Properties below:   browserstack.username / browserstack.accesskey
#
# Grid URL is auto-built from credentials. Override for private cloud:
#   -Dbrowserstack.grid.url=https://user:key@hub-cloud.browserstack.com/wd/hub
# =============================================================================

execution.mode=browserstack
headless=false

# ---- Credentials ----
# Leave blank here; pass via -D flags or CI env vars (never commit real keys)
browserstack.username=${BROWSERSTACK_USERNAME}
browserstack.accesskey=${BROWSERSTACK_ACCESS_KEY}
browserstack.grid.url=https://${BROWSERSTACK_USERNAME}:${BROWSERSTACK_ACCESS_KEY}@hub-cloud.browserstack.com/wd/hub

# ---- Platform / OS ----
browserstack.os=Windows
browserstack.os.version=11
browserstack.browser.version=latest

# ---- Build & Session Identity ----
# ${BUILD_NUMBER} is auto-resolved from CI (Bitbucket/GitHub) or falls back to timestamp
browserstack.build.name=Selenium Framework - Build #${BUILD_NUMBER}
browserstack.project.name=Selenium Framework
browserstack.test.name=${TEST_NAME}

# ---- Debugging & Diagnostics ----
# Network logs: capture HAR network data for debugging
browserstack.network.logs=true
# Console logs: capture browser console output (errors, warnings, info)
# Valid values: disable | errors | warnings | info | verbose
browserstack.console.logs=info
# Video: record test execution video (recommended for failure analysis)
browserstack.video=true
# Visual: capture step-by-step screenshots
browserstack.visual=true
# Selenium logs: capture raw Selenium command logs
browserstack.selenium.logs=true

# ---- BrowserStack Local (Tunnel) ----
# Set to true when testing apps behind a firewall/localhost
# Requires BrowserStackLocal binary running locally or in CI
browserstack.local=false
browserstack.local.identifier=

# ---- Timeouts ----
# Max seconds a test can run on the platform before auto-termination
browserstack.idle.timeout=120

# ---- Performance ----
# Disable video/visual/network in CI to speed up sessions:
#   mvn clean test -Denv=browserstack -Dbrowserstack.video=false -Dbrowserstack.visual=false
