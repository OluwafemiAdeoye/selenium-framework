# =============================================================================
# LambdaTest Cloud Execution Configuration
# Activated via: mvn clean test -Denv=lambdatest
#
# Credentials resolution order (first non-empty wins):
#   1. System properties:  -DLT_USERNAME=xxx -DLT_ACCESS_KEY=xxx
#   2. Environment vars:   export LT_USERNAME=xxx  export LT_ACCESS_KEY=xxx
#   3. Properties below:   lambdatest.username / lambdatest.accesskey
#
# Grid URL is auto-built from credentials. Override if using a private tunnel:
#   -Dlambdatest.grid.url=https://user:key@hub.lambdatest.com/wd/hub
# =============================================================================

execution.mode=lambdatest
headless=false

# ---- Credentials ----
# Leave blank here; pass via -D flags or CI env vars (never commit real keys)
lambdatest.username=${LT_USERNAME}
lambdatest.accesskey=${LT_ACCESS_KEY}
lambdatest.grid.url=https://${LT_USERNAME}:${LT_ACCESS_KEY}@hub.lambdatest.com/wd/hub

# ---- Platform / OS ----
lambdatest.platform=Windows 11
lambdatest.browser.version=latest

# ---- Build & Session Identity ----
# ${BUILD_NUMBER} is auto-resolved from CI (Bitbucket/GitHub) or falls back to timestamp
lambdatest.build.name=Selenium Framework - Build #${BUILD_NUMBER}
lambdatest.project.name=Selenium Framework
lambdatest.test.name=${TEST_NAME}

# ---- Debugging & Diagnostics ----
# Network logs: capture XHR/fetch calls for debugging API issues
lambdatest.network=true
# Console logs: capture browser console output (errors, warnings, info)
lambdatest.console=true
# Video: record test execution video (recommended for failure analysis)
lambdatest.video=true
# Visual: capture step-by-step screenshots (useful for visual regression)
lambdatest.visual=true

# ---- Tunnel ----
# Set to true when testing apps behind a firewall/localhost
# Requires LambdaTest Tunnel binary running locally or in CI
lambdatest.tunnel=false
lambdatest.tunnel.name=

# ---- Timeouts ----
# Max seconds a test can run on the platform before auto-termination
lambdatest.idle.timeout=120
# Selenium command timeout (seconds)
lambdatest.selenium.version=4.0.0

# ---- Performance ----
# Disable video/visual/network in CI to reduce session overhead:
#   mvn clean test -Denv=lambdatest -Dlambdatest.video=false -Dlambdatest.visual=false
