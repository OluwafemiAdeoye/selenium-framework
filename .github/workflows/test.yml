name: Selenium Tests

on:
  push:
    branches: [ main, develop ]
  pull_request:
    branches: [ main ]
  workflow_dispatch:
    inputs:
      suite:
        description: 'Test suite (default/smoke/regression)'
        required: false
        default: 'default'
      environment:
        description: 'Execution environment'
        required: false
        default: 'local'
        type: choice
        options:
          - local
          - lambdatest
          - browserstack
          - saucelabs

jobs:
  test:
    runs-on: ubuntu-latest

    strategy:
      fail-fast: false
      matrix:
        browser: [ chrome ]

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          java-version: '21'
          distribution: 'temurin'
          cache: maven

      - name: Set up Chrome
        if: ${{ github.event.inputs.environment == 'local' || github.event.inputs.environment == '' }}
        uses: browser-actions/setup-chrome@v1
        with:
          chrome-version: stable

      - name: Determine suite profile
        id: suite
        run: |
          SUITE="${{ github.event.inputs.suite || 'default' }}"
          if [ "$SUITE" = "smoke" ]; then
            echo "profile=-Psmoke" >> $GITHUB_OUTPUT
          elif [ "$SUITE" = "regression" ]; then
            echo "profile=-Pregression" >> $GITHUB_OUTPUT
          else
            echo "profile=" >> $GITHUB_OUTPUT
          fi

      - name: Determine environment flags
        id: env-flags
        run: |
          ENV="${{ github.event.inputs.environment || 'local' }}"
          if [ "$ENV" = "local" ]; then
            echo "flags=-Denv=staging -Dheadless=true" >> $GITHUB_OUTPUT
          elif [ "$ENV" = "lambdatest" ]; then
            echo "flags=-Denv=lambdatest -DLT_USERNAME=${{ secrets.LT_USERNAME }} -DLT_ACCESS_KEY=${{ secrets.LT_ACCESS_KEY }} -DBUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_OUTPUT
          elif [ "$ENV" = "browserstack" ]; then
            echo "flags=-Denv=browserstack -DBROWSERSTACK_USERNAME=${{ secrets.BROWSERSTACK_USERNAME }} -DBROWSERSTACK_ACCESS_KEY=${{ secrets.BROWSERSTACK_ACCESS_KEY }} -DBUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_OUTPUT
          elif [ "$ENV" = "saucelabs" ]; then
            echo "flags=-Denv=saucelabs -DSAUCELABS_USERNAME=${{ secrets.SAUCELABS_USERNAME }} -DSAUCELABS_ACCESS_KEY=${{ secrets.SAUCELABS_ACCESS_KEY }} -DBUILD_NUMBER=${{ github.run_number }}" >> $GITHUB_OUTPUT
          fi

      - name: Run tests
        run: |
          mvn clean test ${{ steps.suite.outputs.profile }} \
            -Dbrowser=${{ matrix.browser }} \
            ${{ steps.env-flags.outputs.flags }}
        continue-on-error: true

      - name: Generate Allure Report
        if: always()
        run: mvn allure:report

      - name: Upload Allure Report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-report-${{ matrix.browser }}
          path: target/allure-report/
          retention-days: 30

      - name: Upload Allure Results (raw)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: allure-results-${{ matrix.browser }}
          path: target/allure-results/
          retention-days: 30

      - name: Upload ExtentReports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: extent-report-${{ matrix.browser }}
          path: target/extent-reports/
          retention-days: 30

      - name: Upload Screenshots
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: failure-screenshots-${{ matrix.browser }}
          path: target/screenshots/
          retention-days: 14

      - name: Upload Test Logs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: test-logs-${{ matrix.browser }}
          path: target/logs/
          retention-days: 14
